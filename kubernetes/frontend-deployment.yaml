apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay-frontend
  template:
    metadata:
      labels:
        app: novapay-frontend
    spec:
      containers:
        - name: frontend
          image: nitindrathod/novapay-frontend:latest
          ports:
            - containerPort: 5173
