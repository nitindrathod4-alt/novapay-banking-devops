name: NovaPay DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci
      - name: Validate Backend Syntax
        working-directory: backend
        run: node --check server.js
      - name: Validate Backend Controllers
        working-directory: backend
        run: |
          shopt -s nullglob
          for file in controllers/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

  docker-build:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -t novapay-backend:ci ./backend
      - name: Build Frontend Docker Image
        run: docker build -t novapay-frontend:ci ./frontend
      - name: Verify Docker Images
        run: docker images | grep novapay
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: novapay-backend:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: novapay-frontend:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - docker-build
    steps:
      - name: Pipeline Success
        run: |
          echo "======================================"
          echo "NovaPay CI Pipeline Passed"
          echo "Frontend build: PASS"
          echo "Backend validation: PASS"
          echo "Docker build: PASS"
          echo "Trivy security scan: PASS"
          echo "======================================"
